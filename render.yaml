services:
  - type: web
    name: coachbot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false # введёте вручную в панели Render
      - key: DATABASE_URL
        fromDatabase:
          name: coachbot-db
          property: connectionString
      - key: NODE_VERSION
        value: 20

databases:
  - name: coachbot-db
    plan: free # бесплатная база Render живёт 30 дней, см. README
