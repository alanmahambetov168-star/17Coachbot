function nx(){if(o.s==0){o.age=+$('#ia').value;o.h=+$('#ih').value;o.w=+$('#iw').value;if(!(o.age>9&&o.age<100&&o.h>100&&o.h<250&&o.w>25&&o.w<300))return tg.showAlert(t('chk'))}
if(o.s==1&&!o.goal||o.s==2&&o.act===undefined||o.s==3&&!o.place)return tg.showAlert(t('pick'));
if(o.s<3){o.s++;return onb()}S.p={name:tg.initDataUnsafe?.user?.first_name||'',sex:o.sex,age:o.age,h:o.h,w:o.w,goal:o.goal,act:o.act,place:o.place};if(!S.wlog.length)S.wlog.push([T(),o.w]);save();tab=0;render();syncN()}

/* ===== ЭКРАНЫ ===== */
function streak(){let n=0,d=new Date();if(!S.done[dk(d)])d.setDate(d.getDate()-1);while(S.done[dk(d)]){n++;d.setDate(d.getDate()-1)}return n}
function home(){const pl=plan(),e=eaten(),w=S.water[T()]||0,pct=Math.min(100,Math.round(Math.min(1,e/pl.k)*50+(S.work[T()]?30:0)+Math.min(1,w/8)*20)),n=streak(),d=new Date().getDay(),dt=DT[d],ex=PL[S.p.place][dt==='rest'?'full':dt],C=2*Math.PI*52,m=ML();
return`<div class="m">${MON[d][li]}, ${new Date().toLocaleDateString(LOC[li],{day:'numeric',month:'long'})}</div><h1>${t('hi')}, <b>${esc(S.p.name)}</b></h1>
<div class="g hero"><div class="ic">🔥</div><div><div class="n mono">${n}</div><div style="font-weight:800;font-size:18px">${dy(n)}</div><div class="m">${n?t('keep'):t('light')}</div></div></div>
<div class="g row"><svg width="130" height="130" viewBox="0 0 130 130"><circle cx="65" cy="65" r="52" fill="none" stroke="rgba(127,127,127,.2)" stroke-width="13"/><circle cx="65" cy="65" r="52" fill="none" stroke="var(--a)" stroke-width="13" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.min(1,e/pl.k))}" transform="rotate(-90 65 65)"/><text x="65" y="64" text-anchor="middle" class="mono" fill="currentColor" font-size="22">${e}</text><text x="65" y="84" text-anchor="middle" fill="var(--mut)" font-size="11">/ ${pl.k} ${t('kcal')}</text></svg>
<div class="col"><div class="m">${t('dayIn')}</div><div style="font:800 40px Manrope">${pct}%</div><div class="row wrap" style="gap:5px"><span class="chip c1">${pl.k} ${t('kcal')}</span><span class="chip c2">${pl.p}${t('g')} ${m[0]}</span><span class="chip c3">${pl.f}${t('g')} ${m[1]}</span><span class="chip c4">${pl.c}${t('g')} ${m[2]}</span></div></div></div>
<button class="g row opt" style="margin-bottom:14px" onclick="toggleDay()"><span class="chk ${S.done[T()]?'on':''}">${S.done[T()]?'✓':''}</span>${S.done[T()]?t('fined'):t('fin')}</button>
<div class="g dark" onclick="tab=1;render()"><div class="m" style="color:#c6f26b">${t('wk')} · ${MON[d][li].toUpperCase()}</div><h2 style="margin:6px 0">${DN[dt][li]}</h2><div class="m">${S.p.place=='home'?t('homeS'):t('gymS')} · ${dt=='rest'?t('rest30'):ex.length+' '+t('exc')} ${S.work[T()]?'· ✅ '+t('dn'):''}</div></div>
<div class="g"><div class="row sb"><h3>💧 ${t('water')}</h3><span class="mono">${w} / 8 ${t('gl')}</span></div><div class="bar" style="margin:10px 0"><i style="width:${Math.min(100,w/8*100)}%"></i></div><div class="row"><button class="btn s sm" onclick="water(-1)">−</button><button class="btn sm" onclick="water(1)">${t('addGl')}</button></div></div>
<div class="g"><h3>${t('tip')}</h3><div class="m">${TIPS[new Date().getDate()%TIPS.length][li]}</div></div>`}
function toggleDay(){S.done[T()]=!S.done[T()];hp();save();render()}
function water(d){S.water[T()]=Math.max(0,(S.water[T()]||0)+d);hp();save();render()}
function work(){const dt=DT[wd],ex=dt=='rest'?[]:PL[S.p.place][dt];
return`<h2>${t('n1')}</h2><div class="days">${[1,2,3,4,5,6,0].map(d=>`<button class="${d==wd?'on':''}" onclick="wd=${d};render()">${SH[d][li]}</button>`).join('')}</div>
<div class="g dark"><div class="m">${MON[wd][li]} · ${S.p.place=='home'?t('homeS'):t('gymS')}</div><h2 style="margin:4px 0">${DN[dt][li]}</h2><div class="m">${t('warm')}</div></div>
${dt=='rest'?`<div class="g"><h3>${t('recv')}</h3><div class="m">${t('recvT')}</div></div>`:ex.map(id=>`<div class="g row sb"><div class="col"><h3>${E[id][0][li]}</h3><div class="m">${MU[E[id][1]][li]}</div></div><span class="chip c2">${reps(id)}</span><button class="btn sm" onclick="tech('${id}')">${t('tech')}</button></div>`).join('')}
${wd==new Date().getDay()&&dt!='rest'?`<button class="btn" onclick="S.work[T()]=!S.work[T()];hp();save();render()">${S.work[T()]?t('isDone'):t('mkDone')}</button>`:''}
<button class="btn s" style="margin-top:10px" onclick="allTech()">${t('allT')}</button>`}
const tech=id=>sheet(`<h2>${E[id][0][li]}</h2><div class="m">${MU[E[id][1]][li]}</div><p style="line-height:1.5">${E[id][2][li]}</p><div class="g" style="padding:12px">${t('warn')}</div><button class="btn" onclick="closeSh()">${t('ok')}</button>`);
const allTech=()=>sheet(`<h2>${t('allTh')}</h2>`+Object.keys(E).map(id=>`<div class="g"><h3>${E[id][0][li]}</h3><div class="m">${E[id][2][li]}</div></div>`).join(''));
function food(){const q=(window.fq||'').toLowerCase(),ea=S.meals[T()]||[];
return`<h2>${t('foodT')}</h2><div class="m" style="margin-bottom:10px">${f(t('plan'),{g:GN[S.p.goal][li],k:plan().k})}</div>
${meals().map(m=>`<div class="g row"><span class="chk ${ea.includes(m.i)?'on':''}" onclick="eat(${m.i})">${ea.includes(m.i)?'✓':''}</span><div class="col" onclick="rec(${m.ri},${m.k})"><h3>${m.n}: ${m.r[0][li]}</h3><div class="m">${m.k} ${t('kcal')} · ${ML()[0]} ${m.b} · ${ML()[1]} ${m.j} · ${ML()[2]} ${m.u}</div></div></div>`).join('')}
<h2 style="margin-top:20px">${t('ft')}</h2><input placeholder="${t('srch')}" value="${esc(window.fq||'')}" oninput="window.fq=this.value;fl()"><div class="g" id="ft">${ftab(q)}</div>`}
const ftab=q=>`<table><tr class="m"><th>${t('prod')}</th><th>${t('kcal')}</th><th>${ML()[0]}</th><th>${ML()[1]}</th><th>${ML()[2]}</th></tr>${F.filter(x=>x[0][li].toLowerCase().includes(q)).map(x=>`<tr><td>${x[0][li]}</td><td class="mono">${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td><td>${x[4]}</td></tr>`).join('')}</table>`;
const fl=()=>$('#ft').innerHTML=ftab((window.fq||'').toLowerCase());
function eat(i){const a=S.meals[T()]||(S.meals[T()]=[]);a.includes(i)?a.splice(a.indexOf(i),1):a.push(i);hp();save();render()}
function rec(ri,kc){const x=scale(ri,kc),m=ML();sheet(`<h2>${x.r[0][li]}</h2><div class="row wrap" style="gap:6px;margin-bottom:12px"><span class="chip c1">${x.k} ${t('kcal')}</span><span class="chip c2">${m[0]} ${x.b}${t('g')}</span><span class="chip c3">${m[1]} ${x.j}${t('g')}</span><span class="chip c4">${m[2]} ${x.u}${t('g')}</span></div><div class="m">${t('forGoal')} ${GN[S.p.goal][li].toLowerCase()}</div><div class="g" style="margin-top:8px"><table>${x.ing.map(i=>`<tr><td>${i.n}</td><td class="mono">${i.g} ${t('g')}</td></tr>`).join('')}</table></div><p style="line-height:1.5">${x.r[2][li]}</p><div class="m">${t('cost')}</div><button class="btn" style="margin-top:12px" onclick="closeSh()">${t('close')}</button>`)}
function recipes(){const m=ML();return`<h2>${t('recT')}</h2><div class="m" style="margin-bottom:10px">${t('recS')}</div>${RC.map((r,i)=>{const kc=plan().k*(i<3?.25:i<6?.35:.3),x=scale(i,kc);return`<div class="g" onclick="rec(${i},${kc})"><div class="row sb"><h3>${r[0][li]}</h3><span class="chip c1">${x.k} ${t('kcal')}</span></div><div class="m">${m[0]} ${x.b} · ${m[1]} ${x.j} · ${m[2]} ${x.u} · ${x.ing.reduce((a,b)=>a+b.g,0)} ${t('g')}</div></div>`}).join('')}`}
function prof(){const pl=plan(),p=S.p,wl=S.wlog,m=ML(),d=wl.length>1?(wl[wl.length-1][1]-wl[0][1]).toFixed(1):0;
return`<h2>${t('profT')}</h2><div class="g"><div class="row sb"><div><div class="m">${t('bmi')}</div><div style="font:800 40px Manrope">${pl.bmi.toFixed(1)}</div></div><span class="chip c2">${bmiTxt(pl.bmi)}</span></div><div class="m">${GN[p.goal][li]} · ${p.place=='home'?t('homeS'):t('gymS')} · ${p.age} ${t('yrs')}, ${p.h} ${t('cm')}, ${p.w} ${t('kg')}</div></div>
<div class="g"><h3>${t('norm')}</h3><div class="row wrap" style="gap:6px"><span class="chip c1">${pl.k} ${t('kcal')}</span><span class="chip c2">${m[0]} ${pl.p}${t('g')}</span><span class="chip c3">${m[1]} ${pl.f}${t('g')}</span><span class="chip c4">${m[2]} ${pl.c}${t('g')}</span></div></div>
<div class="g"><h3>${t('wT')}</h3><div class="m">${t('chg')}: ${d>0?'+':''}${d} ${t('kg')} · ${t('ent')}: ${wl.length}</div><div class="row" style="margin-top:8px"><input id="nw" type="number" step="0.1" placeholder="${t('newW')}" style="margin:0"><button class="btn sm" onclick="addW()">${t('sv')}</button></div></div>
<div class="g"><h3>${t('ach')}</h3><div class="row wrap" style="gap:8px">${BD.map(b=>`<span class="chip ${b[2]()?'c4':''}" style="${b[2]()?'':'opacity:.45'}">${b[0]} ${b[1][li]}</span>`).join('')}</div></div>
<button class="btn s" onclick="o={s:0,sex:'m'};S.p=null;render()">${t('edit')}</button>`}
function addW(){const w=+$('#nw').value;if(!(w>25&&w<300))return;S.wlog.push([T(),w]);S.p.w=w;save();render()}
async function revs(){let l=[];try{l=await api('/api/reviews')}catch(e){}
$('#rl').innerHTML=Array.isArray(l)&&l.length?l.map(r=>`<div class="g"><div class="row sb"><h3>${esc(r.name)}</h3><span class="st">${'★'.repeat(r.stars)}</span></div><div class="m">${esc(r.text)}</div></div>`).join(''):`<div class="m">${t('noRev')}</div>`}
const stars=()=>$('#stars').innerHTML=[1,2,3,4,5].map(i=>`<span onclick="rv.stars=${i};stars()">${i<=rv.stars?'★':'☆'}</span>`).join('');
function reviews(){setTimeout(revs);return`<h2>${t('revT')}</h2><div class="g"><div class="st" id="stars">${[1,2,3,4,5].map(i=>`<span onclick="rv.stars=${i};stars()">${i<=rv.stars?'★':'☆'}</span>`).join('')}</div><textarea id="rt" rows="3" placeholder="${t('liked')}"></textarea><button class="btn" onclick="sendRev()">${t('send')}</button></div><div id="rl"></div>`}
async function sendRev(){const x=$('#rt').value.trim();if(x.length<3)return tg.showAlert(t('fw'));try{await api('/api/reviews',{stars:rv.stars,text:x});$('#rt').value='';revs()}catch(e){tg.showAlert(t('fail'))}}
function sett(){const s=S.set;return`<h2>${t('setT')}</h2><div class="g"><h3>${t('lang')}</h3><div class="seg">${[['ru','Русский'],['en','English'],['kk','Қазақша']].map(([c,n])=>`<button class="${S.lang==c?'on':''}" onclick="setLang('${c}')">${n}</button>`).join('')}</div></div>
<div class="g"><h3>${t('theme')}</h3><div class="seg">${[['auto','auto'],['light','lt'],['dark','dk']].map(([k,n])=>`<button class="${s.theme==k?'on':''}" onclick="S.set.theme='${k}';save();skin();render()">${t(n)}</button>`).join('')}</div>
<h3 style="margin-top:16px">${t('acc')}</h3><div class="row">${[['coral','#f0645a'],['teal','#2f9a8c'],['violet','#9a6bf0']].map(([k,c])=>`<button class="dot ${s.acc==k?'on':''}" style="background:${c}" onclick="S.set.acc='${k}';save();skin();render()"></button>`).join('')}</div></div>
<div class="g"><div class="row sb"><div><h3>${t('nt')}</h3><div class="m">${t('nts')}</div></div><button class="sw ${s.notify?'on':''}" onclick="togN()"></button></div>${s.notify?`<div class="row sb" style="margin-top:12px"><span>${t('tm')}</span><input type="time" value="${s.time}" style="width:130px;margin:0" onchange="S.set.time=this.value;save();syncN()"></div>`:''}</div>
<div class="g row sb"><div><h3>${t('hap')}</h3><div class="m">${t('haps')}</div></div><button class="sw ${s.hap?'on':''}" onclick="S.set.hap=!S.set.hap;save();render()"></button></div>
<button class="btn s" onclick="tg.showConfirm(t('rq'),ok=>{if(ok){localStorage.removeItem('cb');location.reload()}})">${t('reset')}</button>`}
function togN(){S.set.notify=!S.set.notify;save();if(S.set.notify&&tg.requestWriteAccess)tg.requestWriteAccess();syncN();render()}
const syncN=()=>api('/api/settings',{notify:S.set.notify,time:S.set.time,tz:new Date().getTimezoneOffset(),name:S.p?.name,lang:S.lang}).catch(()=>{});
const TABS=[['☀️',home],['🏋️',work],['🥗',food],['👨‍🍳',recipes],['👤',prof],['⭐',reviews],['⚙️',sett]];
function render(){skin();if(!S.lang)return langScr();if(!S.p)return onb();const n=$('#nav');n.style.display='flex';n.innerHTML=TABS.map((x,i)=>`<button class="${tab==i?'on':''}" onclick="tab=${i};render();scrollTo(0,0)"><span>${x[0]}</span>${t('n'+i)}</button>`).join('');$('#v').innerHTML=TABS[tab][1]();n.querySelector('.on')?.scrollIntoView({inline:'center',block:'nearest'})}
render();if(S.p&&S.lang)syncN();
</script></body></html>
