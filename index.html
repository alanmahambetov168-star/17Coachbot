<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CoachBot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14262b;--mut:#6b7a7d;--glass:rgba(255,255,255,.5);--bd:rgba(255,255,255,.75);--t:#14595e;--bg:linear-gradient(165deg,#f8b3a6,#fdeee4 42%,#d6ece7);--a:#f0645a;--a2:#e8575f}
[data-t=d]{--ink:#eaf3f2;--mut:#93a8aa;--glass:rgba(255,255,255,.08);--bd:rgba(255,255,255,.16);--bg:linear-gradient(165deg,#0d1a22,#142e35 55%,#1b2a3a)}
[data-a=teal]{--a:#2f9a8c;--a2:#17707a}[data-a=violet]{--a:#9a6bf0;--a2:#6b52e0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:600 15px Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg) fixed;min-height:100vh}
body:before{content:"";position:fixed;width:300px;height:300px;right:-100px;top:35%;background:var(--a);opacity:.22;filter:blur(90px);border-radius:50%;z-index:-1}
#v{padding:18px 16px 120px;max-width:560px;margin:auto}
.g{background:var(--glass);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border:1px solid var(--bd);border-radius:30px;box-shadow:0 12px 30px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.5);padding:18px;margin-bottom:14px}
h1{font-size:36px;line-height:1.05;font-weight:800;margin:4px 0 16px;letter-spacing:-1px}h1 b{color:var(--a)}
h2{font-size:24px;font-weight:800;margin:6px 0 12px;letter-spacing:-.5px}h3{margin:0 0 6px;font-size:17px;font-weight:800}
.m{color:var(--mut);font-weight:600;font-size:13px}.mono{font-family:'JetBrains Mono',monospace;font-weight:700}
.hero{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;border:1px solid rgba(255,255,255,.4);display:flex;gap:16px;align-items:center}
.hero .ic{width:84px;height:84px;border-radius:28px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:40px}
.hero .n{font:800 52px/1 Manrope}.hero .m{color:rgba(255,255,255,.8)}
.row{display:flex;gap:12px;align-items:center}.sb{justify-content:space-between}.wrap{flex-wrap:wrap}.col{flex:1;min-width:0}
.chip{padding:6px 11px;border-radius:14px;font:700 12px 'JetBrains Mono';background:rgba(127,127,127,.15)}
.c1{background:#f9d5cf;color:#c0402f}.c2{background:#cfe3e6;color:#1d5a63}.c3{background:#fbe6c4;color:#a2600c}.c4{background:#d9ecc9;color:#3e7a1f}
.btn{border:0;border-radius:22px;padding:14px 18px;font:800 15px Manrope;color:#fff;background:linear-gradient(135deg,var(--a),var(--a2));width:100%;cursor:pointer}
.btn.s{background:var(--glass);color:var(--ink);border:1px solid var(--bd)}.btn.sm{width:auto;padding:9px 14px;border-radius:16px;font-size:13px}
.dark{background:linear-gradient(135deg,#1a5a5c,#2c7a72);color:#fff}.dark .m{color:#b8dcd5}
.opt{display:block;width:100%;text-align:left;padding:15px;margin-bottom:10px;border-radius:22px;border:1.5px solid var(--bd);background:var(--glass);color:var(--ink);font:700 15px Manrope}
.opt.on{border-color:var(--a);background:color-mix(in srgb,var(--a) 18%,transparent)}
input,textarea{width:100%;padding:14px;border-radius:18px;border:1px solid var(--bd);background:var(--glass);color:var(--ink);font:700 16px Manrope;margin-bottom:10px;outline:0}
.seg{display:flex;gap:6px;background:rgba(127,127,127,.15);border-radius:18px;padding:4px}.seg button{flex:1;border:0;padding:9px;border-radius:14px;background:none;color:var(--ink);font:700 13px Manrope}.seg .on{background:var(--t);color:#fff}
.sw{width:52px;height:30px;border-radius:20px;background:rgba(127,127,127,.35);position:relative;border:0;flex:none}.sw:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--t)}.sw.on:after{left:25px}
.dot{width:34px;height:34px;border-radius:50%;border:3px solid transparent}.dot.on{border-color:var(--ink)}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--mut);flex:none;display:grid;place-items:center;font-size:16px}.chk.on{background:var(--t);border-color:var(--t);color:#fff}
.days{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.days button{flex:none;padding:9px 13px;border-radius:16px;border:1px solid var(--bd);background:var(--glass);color:var(--ink);font:700 13px Manrope}.days .on{background:var(--t);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 3px;text-align:right}td:first-child,th:first-child{text-align:left}tr+tr td{border-top:1px solid var(--bd)}
#nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:4px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px;border-radius:34px;background:var(--glass);backdrop-filter:blur(26px) saturate(1.8);-webkit-backdrop-filter:blur(26px) saturate(1.8);border:1px solid var(--bd);box-shadow:0 14px 34px rgba(0,0,0,.18);scrollbar-width:none;z-index:5}
#nav::-webkit-scrollbar{display:none}#nav button{flex:none;scroll-snap-align:center;min-width:82px;padding:9px 6px;border:0;border-radius:26px;background:none;color:var(--mut);font:700 11px Manrope;display:grid;gap:2px;justify-items:center}#nav span{font-size:22px}#nav .on{background:var(--t);color:#fff}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9;display:flex;align-items:flex-end}#sh>div{width:100%;max-height:86vh;overflow:auto;background:var(--bg);background-color:#f6e6df;border-radius:32px 32px 0 0;padding:22px 18px 30px;animation:up .25s}
[data-t=d] #sh>div{background-color:#10222a}@keyframes up{from{transform:translateY(40px);opacity:0}}
.bar{height:8px;border-radius:6px;background:rgba(127,127,127,.2);overflow:hidden}.bar i{display:block;height:100%;background:var(--a);border-radius:6px}
.lock{opacity:.6}.st{color:#f5b301;font-size:20px;letter-spacing:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="v"></div><div id="nav"></div>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
const $=s=>document.querySelector(s);
const dk=d=>(d||new Date()).toLocaleDateString('sv'),T=()=>dk();
let S=JSON.parse(localStorage.getItem('cb')||'null')||{p:null,done:{},work:{},meals:{},water:{},wlog:[],set:{theme:'auto',acc:'coral',notify:false,time:'20:00',hap:true}};
const save=()=>localStorage.setItem('cb',JSON.stringify(S));
const api=(p,b)=>fetch(p,{method:b?'POST':'GET',headers:{'X-Init':tg.initData,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}).then(r=>r.json());
const hp=()=>S.set.hap&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred('light');
let tab='home',wd=new Date().getDay(),o={s:0,sex:'m'},rv={stars:5};
const MON=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'],SH=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
function skin(){const t=S.set.theme,d=t=='dark'||(t=='auto'&&matchMedia('(prefers-color-scheme:dark)').matches),r=document.documentElement;r.dataset.t=d?'d':'l';r.dataset.a=S.set.acc;try{tg.setHeaderColor(d?'#0d1a22':'#f8b3a6');tg.setBackgroundColor(d?'#0d1a22':'#f8b3a6')}catch(e){}}

/* ---------- расчёты ---------- */
const ACT=[1.2,1.375,1.55,1.725],GOAL={cut:'Похудение',bulk:'Набор массы',keep:'Поддержание'};
function plan(){const p=S.p;let t=(10*p.w+6.25*p.h-5*p.age+(p.sex=='m'?5:-161))*ACT[p.act];t*=p.goal=='cut'?.85:p.goal=='bulk'?1.12:1;t=Math.round(t/10)*10;
const pr=Math.round(p.w*(p.goal=='cut'?2:1.8)),f=Math.round(p.w*.9);return{k:t,p:pr,f,c:Math.max(0,Math.round((t-pr*4-f*9)/4)),bmi:p.w/((p.h/100)**2)}}
const bmiTxt=b=>b<18.5?'дефицит массы':b<25?'норма':b<30?'избыточный вес':'ожирение';
/* продукты на 100 г: [название, ккал, Б, Ж, У] */
const F=[['Овсяные хлопья (сухие)',366,12,6,60],['Яйцо',157,13,11,1],['Куриная грудка',113,23,2,0],['Гречка (сухая)',313,12,3,62],['Рис (сухой)',330,7,1,74],['Макароны (сухие)',350,12,2,71],['Творог 5%',121,17,5,3],['Молоко 2,5%',52,3,2.5,4.7],['Кефир 1%',40,3,1,4],['Банан',96,1.5,.2,21],['Яблоко',47,.4,.4,10],['Картофель',77,2,.4,17],['Морковь',35,1.3,.1,7],['Помидор',20,.9,.2,4],['Огурец',15,.8,.1,2.5],['Говяжий фарш',250,18,20,0],['Тунец консерв. (в соку)',96,22,1,0],['Хлеб ржаной',210,7,1,41],['Масло подсолнечное',899,0,99.9,0],['Арахисовая паста',590,25,50,10],['Йогурт греческий 2%',73,9,2,4],['Лук репчатый',41,1.4,0,10],['Капуста белокочанная',28,1.8,.1,4.7]];
/* рецепты: [название, [[id продукта, граммы базовые]], шаги] */
const RC=[['Овсянка с бананом',[[0,60],[7,200],[9,100],[19,10]],'Сварите хлопья на молоке 7 минут, добавьте нарезанный банан и пасту.'],
['Омлет с помидором',[[1,150],[7,50],[13,80],[17,40],[18,5]],'Взбейте яйца с молоком, вылейте на сковороду с маслом, добавьте помидор. Подайте с хлебом.'],
['Творог с яблоком',[[6,200],[10,150],[8,150]],'Нарежьте яблоко, смешайте с творогом. Кефир — запить.'],
['Курица с гречкой',[[2,150],[3,70],[14,100],[13,100],[18,8]],'Сварите гречку 15 мин. Куриную грудку обжарьте 8–10 мин до 75°C внутри. Салат из овощей с маслом.'],
['Рис с говядиной',[[15,120],[4,70],[12,60],[21,40],[18,5]],'Обжарьте фарш с луком и морковью, добавьте отварной рис, тушите 5 минут.'],
['Паста с тунцом',[[5,80],[16,100],[13,100],[18,8]],'Сварите пасту, смешайте с тунцом и нарезанными помидорами.'],
['Творог с бананом',[[6,150],[9,100]],'Разомните банан и смешайте с творогом.'],
['Йогурт с овсянкой',[[20,150],[0,30],[10,100]],'Залейте хлопья йогуртом на 10 минут, добавьте яблоко.'],
['Курица с картошкой',[[2,160],[11,250],[22,100],[18,8]],'Запеките картофель и курицу при 190°C 30 минут. Подайте с капустным салатом.'],
['Тушёная капуста с фаршем',[[15,100],[22,250],[12,50],[11,100],[18,5]],'Обжарьте фарш, добавьте капусту, морковь и картофель, тушите 25 минут.']];
const RT={b:[0,1,2],l:[3,4,5],s:[6,7],d:[8,3,9,4]},MS=[['Завтрак',.25,'b'],['Обед',.35,'l'],['Перекус',.1,'s'],['Ужин',.3,'d']];
function scale(ri,kc){const r=RC[ri],base=r[1].reduce((a,[f,g])=>a+F[f][1]*g/100,0),x=kc/base;let k=0,b=0,j=0,u=0;
const ing=r[1].map(([f,g])=>{const G=Math.max(5,Math.round(g*x/5)*5),q=G/100;k+=F[f][1]*q;b+=F[f][2]*q;j+=F[f][3]*q;u+=F[f][4]*q;return{n:F[f][0],g:G}});
return{r,ing,k:Math.round(k),b:Math.round(b),j:Math.round(j),u:Math.round(u)}}
function meals(){const pl=plan(),w=new Date().getDay();return MS.map(([n,sh,t],i)=>({n,i,ri:RT[t][w%RT[t].length],...scale(RT[t][w%RT[t].length],pl.k*sh)}))}
const eaten=()=>meals().filter(m=>(S.meals[T()]||[]).includes(m.i)).reduce((a,m)=>a+m.k,0);

/* ---------- тренировки ---------- */
const E={pu:['Отжимания','грудь, трицепс','Ладони чуть шире плеч, тело — прямая линия от пяток до затылка. Опускайтесь до угла 90° в локтях, локти под 45° к корпусу, не разводите их в стороны. Не прогибайтесь в пояснице. Сложно — отжимайтесь от колен.'],
sq:['Приседания','ноги, ягодицы','Стопы на ширине плеч, носки слегка наружу. Таз назад, как будто садитесь на стул, спина прямая, колени идут по линии носков и не заваливаются внутрь. Пятки не отрывать. Глубина — до параллели бёдер с полом.'],
lu:['Выпады','ноги, ягодицы','Шаг вперёд, корпус вертикально. Переднее колено над стопой, не выходит далеко за носок и не заваливается внутрь. Опускайтесь, пока заднее колено почти касается пола. Отталкивайтесь пяткой передней ноги.'],
gb:['Ягодичный мостик','ягодицы, бёдра','Лёжа на спине, стопы у таза, колени согнуты. Поднимайте таз, сжимая ягодицы, до прямой линии плечи–колени. Вверху пауза 1–2 сек. Не прогибайте поясницу, не запрокидывайте голову.'],
pl:['Планка','кор','Локти под плечами, тело — прямая линия. Напрягите пресс и ягодицы, смотрите в пол. Таз не поднимать и не провисать. Дышите ровно. При боли в пояснице закончите подход.'],
pk:['Отжимания «горкой»','плечи','Таз высоко, тело — перевёрнутая V. Сгибайте локти, голова идёт между рук, макушка к полу. Локти слегка вперёд, не в стороны. Если болят плечи — уменьшите амплитуду.'],
bk:['Тяга рюкзака в наклоне','спина','Рюкзак с грузом в руках, наклон корпуса ~45°, спина ровная (не круглая!), колени слегка согнуты. Тяните рюкзак к низу живота, сводя лопатки. Опускайте медленно. Не рывками.'],
sup:['«Супермен»','низ спины','Лёжа на животе, одновременно поднимите руки и ноги на 5–10 см, пауза 2 сек, плавно вниз. Шею держите в нейтрали, не запрокидывайте голову. Без рывков.'],
bp:['Жим лёжа','грудь, трицепс','Лопатки сведены и прижаты к скамье, стопы на полу. Гриф опускайте к нижней части груди, локти ~45°. Запястья ровно над локтями. Всегда работайте со страхующим или в стойках с упорами.'],
ohp:['Жим гантелей сидя','плечи','Спина прижата к спинке, пресс напряжён. Выжимайте гантели вверх, не прогибая поясницу, внизу — до уровня ушей. Берите вес, с которым контролируете каждое повторение.'],
lp:['Жим ногами','ноги, ягодицы','Поясница прижата к спинке, стопы на ширине плеч. Опускайте платформу до угла в коленях ~90°. Колени не сводить, не выпрямлять в замок вверху, таз не отрывать от сиденья.'],
rdl:['Румынская тяга','задняя поверхность бедра','Колени слегка согнуты, спина ровная всё движение. Таз уходит назад, гантели скользят вдоль ног, опускайте до ощущения растяжения в бёдрах. Не округляйте спину — это главный риск травмы.'],
lat:['Тяга верхнего блока','спина','Хват шире плеч, корпус слегка назад. Тяните рукоять к верху груди, сводя лопатки, локти вниз. Не раскачивайтесь, не тяните из-за головы — это травмирует плечи.'],
row:['Тяга гантели в наклоне','спина','Колено и рука на скамье, спина ровная. Тяните гантель к поясу, локоть вдоль корпуса. Не вращайте корпус, опускайте медленно.'],
cur:['Подъём гантелей на бицепс','бицепс','Локти прижаты к корпусу, не раскачивайтесь корпусом. Поднимайте до сокращения бицепса, опускайте 2–3 сек. Запястья ровные.']};
const PL={home:{push:['pu','pk','pl'],legs:['sq','lu','gb'],pull:['bk','sup','pl'],full:['sq','pu','bk','gb','pl']},gym:{push:['bp','ohp','pl'],legs:['lp','rdl','lu'],pull:['lat','row','cur'],full:['lp','bp','lat','pl']}};
const DT=['rest','push','legs','rest','pull','full','full'],DN={push:'Грудь и плечи',legs:'Ноги и ягодицы',pull:'Спина и руки',full:'Всё тело',rest:'День отдыха'};
const reps=(id)=>id=='pl'?'3×40 сек':id=='sup'?'3×12':S.p.goal=='cut'?'3×15':S.p.goal=='bulk'?'4×8–10':'3×12';

/* ---------- онбординг ---------- */
function onb(){const s=o.s,v=$('#v');$('#nav').style.display='none';let h='';const opt=(k,val,t)=>`<button class="opt ${o[k]===val?'on':''}" onclick="o.${k}=${JSON.stringify(val)};onb()">${t}</button>`;
if(s==0)h=`<h1>Привет, <b>${esc(tg.initDataUnsafe?.user?.first_name||'друг')}</b></h1><p class="m">Расскажите о себе — рассчитаю норму калорий и подберу план.</p><div class="seg" style="margin-bottom:12px"><button class="${o.sex=='m'?'on':''}" onclick="o.sex='m';onb()">Мужчина</button><button class="${o.sex=='f'?'on':''}" onclick="o.sex='f';onb()">Женщина</button></div>
<input id="ia" type="number" placeholder="Возраст" value="${o.age||''}"><input id="ih" type="number" placeholder="Рост, см" value="${o.h||''}"><input id="iw" type="number" placeholder="Вес, кг" value="${o.w||''}">`;
if(s==1)h=`<h2>Ваша цель</h2>${opt('goal','cut','🔥 Похудение')}${opt('goal','bulk','💪 Набор массы')}${opt('goal','keep','⚖️ Поддержание формы')}`;
if(s==2)h=`<h2>Дневная активность</h2>${opt('act',0,'🛋 Сидячая — офис, почти нет движения')}${opt('act',1,'🚶 Лёгкая — 1–3 тренировки в неделю')}${opt('act',2,'🏃 Средняя — 3–5 тренировок')}${opt('act',3,'⚡ Высокая — каждый день или тяжёлая работа')}`;
if(s==3)h=`<h2>Где занимаетесь?</h2>${opt('place','home','🏠 Дома')}${opt('place','gym','🏋️ В спортзале')}`;
v.innerHTML=`<div class="g">${h}<button class="btn" onclick="nx()">${s==3?'Готово':'Дальше'}</button>${s?'<button class="btn s" style="margin-top:8px" onclick="o.s--;onb()">Назад</button>':''}</div>`}
function nx(){if(o.s==0){o.age=+$('#ia').value;o.h=+$('#ih').value;o.w=+$('#iw').value;if(!(o.age>9&&o.age<100&&o.h>100&&o.h<250&&o.w>25&&o.w<300))return tg.showAlert('Проверьте возраст, рост и вес')}
if(o.s==1&&!o.goal||o.s==2&&o.act===undefined||o.s==3&&!o.place)return tg.showAlert('Выберите вариант');
if(o.s<3){o.s++;return onb()}S.p={name:tg.initDataUnsafe?.user?.first_name||'друг',sex:o.sex,age:o.age,h:o.h,w:o.w,goal:o.goal,act:o.act,place:o.place};if(!S.wlog.length)S.wlog.push([T(),o.w]);save();tab='home';render()}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function sheet(h){let e=$('#sh');if(e)e.remove();e=document.createElement('div');e.id='sh';e.innerHTML=`<div>${h}</div>`;e.onclick=x=>{if(x.target==e)e.remove()};document.body.appendChild(e)}
const closeSh=()=>$('#sh')?.remove();

/* ---------- экраны ---------- */
function streak(){let n=0,d=new Date();if(!S.done[dk(d)])d.setDate(d.getDate()-1);while(S.done[dk(d)]){n++;d.setDate(d.getDate()-1)}return n}
function home(){const pl=plan(),e=eaten(),w=S.water[T()]||0,pct=Math.min(100,Math.round(Math.min(1,e/pl.k)*50+(S.work[T()]?30:0)+Math.min(1,w/8)*20)),n=streak(),dt=DT[new Date().getDay()],ex=PL[S.p.place][dt==='rest'?'full':dt],C=2*Math.PI*52;
return`<div class="m">${MON[new Date().getDay()]}, ${new Date().toLocaleDateString('ru',{day:'numeric',month:'long'})}</div><h1>Привет, <b>${esc(S.p.name)}</b></h1>
<div class="g hero"><div class="ic">🔥</div><div><div class="n mono">${n}</div><div style="font-weight:800;font-size:18px">${plural(n)} подряд</div><div class="m">${n?'Не прерывайте серию!':'Отметьте день завершённым, чтобы зажечь огонь.'}</div></div></div>
<div class="g row"><svg width="130" height="130" viewBox="0 0 130 130"><circle cx="65" cy="65" r="52" fill="none" stroke="rgba(127,127,127,.2)" stroke-width="13"/><circle cx="65" cy="65" r="52" fill="none" stroke="var(--a)" stroke-width="13" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.min(1,e/pl.k))}" transform="rotate(-90 65 65)"/><text x="65" y="64" text-anchor="middle" class="mono" fill="currentColor" font-size="22">${e}</text><text x="65" y="84" text-anchor="middle" fill="var(--mut)" font-size="11">из ${pl.k} ккал</text></svg>
<div class="col"><div class="m">День выполнен на</div><div style="font:800 40px Manrope">${pct}%</div><div class="row wrap" style="gap:5px"><span class="chip c1">${pl.k} ккал</span><span class="chip c2">${pl.p}г Б</span><span class="chip c3">${pl.f}г Ж</span><span class="chip c4">${pl.c}г У</span></div></div></div>
<button class="g row opt" style="margin-bottom:14px" onclick="toggleDay()"><span class="chk ${S.done[T()]?'on':''}">${S.done[T()]?'✓':''}</span>${S.done[T()]?'День завершён':'Завершить день'}</button>
<div class="g dark" onclick="tab='work';render()"><div class="m" style="color:#c6f26b">ТРЕНИРОВКА · ${MON[new Date().getDay()].toUpperCase()}</div><h2 style="margin:6px 0">${DN[dt]}</h2><div class="m">${S.p.place=='home'?'Дома':'В зале'} · ${dt=='rest'?'прогулка 30–40 мин и растяжка':ex.length+' упражнения'} ${S.work[T()]?'· ✅ выполнена':''}</div></div>
<div class="g"><div class="row sb"><h3>💧 Вода</h3><span class="mono">${w} / 8 стаканов</span></div><div class="bar" style="margin:10px 0"><i style="width:${Math.min(100,w/8*100)}%"></i></div><div class="row"><button class="btn s sm" onclick="water(-1)">−</button><button class="btn sm" onclick="water(1)">+ стакан</button></div></div>
<div class="g"><h3>Совет дня</h3><div class="m">${TIPS[new Date().getDate()%TIPS.length]}</div></div>`}
const TIPS=['Белок в каждом приёме пищи помогает дольше не чувствовать голод.','Сон 7–9 часов — половина результата. Мышцы растут во сне.','Разминка 5–7 минут снижает риск травмы.','Вес колеблется на 1–2 кг в течение дня — смотрите на тренд за неделю.','Добавляйте нагрузку постепенно: +1 повторение или +2 кг в неделю.','Овощи в каждый обед — дёшево и сытно.'];
const plural=n=>n%10==1&&n%100!=11?'день':n%10>1&&n%10<5&&(n%100<10||n%100>20)?'дня':'дней';
function toggleDay(){S.done[T()]=!S.done[T()];hp();save();render()}
function water(d){S.water[T()]=Math.max(0,(S.water[T()]||0)+d);hp();save();render()}
function work(){const dt=DT[wd],ex=dt=='rest'?[]:PL[S.p.place][dt];
return`<h2>Тренировки</h2><div class="days">${[1,2,3,4,5,6,0].map(d=>`<button class="${d==wd?'on':''}" onclick="wd=${d};render()">${SH[d]}</button>`).join('')}</div>
<div class="g dark"><div class="m">${MON[wd]} · ${S.p.place=='home'?'дома':'зал'}</div><h2 style="margin:4px 0">${DN[dt]}</h2><div class="m">Разминка 5–7 мин: вращения суставами, лёгкое кардио. Отдых между подходами 60–90 сек.</div></div>
${dt=='rest'?'<div class="g"><h3>Восстановление</h3><div class="m">Прогулка 30–40 минут, растяжка, сон. Мышцы растут именно в дни отдыха.</div></div>':ex.map(id=>`<div class="g row sb"><div class="col"><h3>${E[id][0]}</h3><div class="m">${E[id][1]}</div></div><span class="chip c2">${reps(id)}</span><button class="btn sm" onclick="tech('${id}')">Техника</button></div>`).join('')}
${wd==new Date().getDay()&&dt!='rest'?`<button class="btn" onclick="S.work[T()]=!S.work[T()];hp();save();render()">${S.work[T()]?'✅ Тренировка выполнена':'Отметить тренировку выполненной'}</button>`:''}
<button class="btn s" style="margin-top:10px" onclick="allTech()">📖 Техника всех упражнений</button>`}
const tech=id=>sheet(`<h2>${E[id][0]}</h2><div class="m">${E[id][1]}</div><p style="line-height:1.5">${E[id][2]}</p><div class="g" style="padding:12px">⚠️ Появилась острая боль — остановитесь. Рабочий вес — тот, с которым техника остаётся чистой.</div><button class="btn" onclick="closeSh()">Понятно</button>`);
const allTech=()=>sheet('<h2>Техника упражнений</h2>'+Object.keys(E).map(id=>`<div class="g"><h3>${E[id][0]}</h3><div class="m">${E[id][2]}</div></div>`).join(''));
function food(){const q=(window.fq||'').toLowerCase(),ms=meals(),ea=S.meals[T()]||[];
return`<h2>Питание сегодня</h2><div class="m" style="margin-bottom:10px">План под цель «${GOAL[S.p.goal]}» и ${plan().k} ккал. Граммовка рассчитана под вас.</div>
${ms.map(m=>`<div class="g row"><span class="chk ${ea.includes(m.i)?'on':''}" onclick="eat(${m.i})">${ea.includes(m.i)?'✓':''}</span><div class="col" onclick="rec(${m.ri},${m.k})"><h3>${m.n}: ${m.r[0]}</h3><div class="m">${m.k} ккал · Б ${m.b} · Ж ${m.j} · У ${m.u}</div></div></div>`).join('')}
<h2 style="margin-top:20px">КБЖУ продуктов (на 100 г)</h2><input placeholder="Поиск продукта" value="${esc(window.fq||'')}" oninput="window.fq=this.value;fl()"><div class="g" id="ft">${ftab(q)}</div>`}
const ftab=q=>`<table><tr class="m"><th>Продукт</th><th>ккал</th><th>Б</th><th>Ж</th><th>У</th></tr>${F.filter(f=>f[0].toLowerCase().includes(q)).map(f=>`<tr><td>${f[0]}</td><td class="mono">${f[1]}</td><td>${f[2]}</td><td>${f[3]}</td><td>${f[4]}</td></tr>`).join('')}</table>`;
const fl=()=>$('#ft').innerHTML=ftab((window.fq||'').toLowerCase());
function eat(i){const a=S.meals[T()]||(S.meals[T()]=[]);a.includes(i)?a.splice(a.indexOf(i),1):a.push(i);hp();save();render()}
function rec(ri,kc){const x=scale(ri,kc);sheet(`<h2>${x.r[0]}</h2><div class="row wrap" style="gap:6px;margin-bottom:12px"><span class="chip c1">${x.k} ккал</span><span class="chip c2">Б ${x.b}г</span><span class="chip c3">Ж ${x.j}г</span><span class="chip c4">У ${x.u}г</span></div><div class="m">Граммовка под вашу цель — ${GOAL[S.p.goal].toLowerCase()}</div><div class="g" style="margin-top:8px"><table>${x.ing.map(i=>`<tr><td>${i.n}</td><td class="mono">${i.g} г</td></tr>`).join('')}</table></div><p style="line-height:1.5">${x.r[2]}</p><div class="m">Бюджет порции: примерно 80–200 ₽</div><button class="btn" style="margin-top:12px" onclick="closeSh()">Закрыть</button>`)}
function recipes(){return`<h2>Рецепты</h2><div class="m" style="margin-bottom:10px">Бюджетные блюда. КБЖУ и граммовка пересчитаны под вашу норму.</div>${RC.map((r,i)=>{const kc=plan().k*(i<3?.25:i<6?.35:.3),x=scale(i,kc);return`<div class="g" onclick="rec(${i},${kc})"><div class="row sb"><h3>${r[0]}</h3><span class="chip c1">${x.k} ккал</span></div><div class="m">Б ${x.b} · Ж ${x.j} · У ${x.u} · ${x.ing.reduce((a,b)=>a+b.g,0)} г</div></div>`}).join('')}`}
const BD=[['🔥','3 дня подряд',()=>streak()>=3],['⚡','7 дней подряд',()=>streak()>=7],['👑','30 дней подряд',()=>streak()>=30],['💪','10 тренировок',()=>Object.values(S.work).filter(Boolean).length>=10],['💧','Вода 8 стаканов',()=>Object.values(S.water).some(x=>x>=8)],['⚖️','Вес записан 3 раза',()=>S.wlog.length>=3]];
function prof(){const pl=plan(),p=S.p,wl=S.wlog;const d=wl.length>1?(wl[wl.length-1][1]-wl[0][1]).toFixed(1):0;
return`<h2>Профиль</h2><div class="g"><div class="row sb"><div><div class="m">ИМТ</div><div style="font:800 40px Manrope">${pl.bmi.toFixed(1)}</div></div><span class="chip c2">${bmiTxt(pl.bmi)}</span></div><div class="m">${GOAL[p.goal]} · ${p.place=='home'?'дома':'зал'} · ${p.age} лет, ${p.h} см, ${p.w} кг</div></div>
<div class="g"><h3>Норма на день</h3><div class="row wrap" style="gap:6px"><span class="chip c1">${pl.k} ккал</span><span class="chip c2">Б ${pl.p}г</span><span class="chip c3">Ж ${pl.f}г</span><span class="chip c4">У ${pl.c}г</span></div></div>
<div class="g"><h3>Вес</h3><div class="m">Изменение: ${d>0?'+':''}${d} кг · записей: ${wl.length}</div><div class="row" style="margin-top:8px"><input id="nw" type="number" step="0.1" placeholder="Новый вес, кг" style="margin:0"><button class="btn sm" onclick="addW()">Записать</button></div></div>
<div class="g"><h3>Достижения</h3><div class="row wrap" style="gap:8px">${BD.map(b=>`<span class="chip ${b[2]()?'c4':''}" style="${b[2]()?'':'opacity:.45'}">${b[0]} ${b[1]}</span>`).join('')}</div></div>
<button class="btn s" onclick="o={s:0,sex:'m'};S.p=null;render()">Изменить мои данные</button>`}
function addW(){const w=+$('#nw').value;if(!(w>25&&w<300))return;S.wlog.push([T(),w]);S.p.w=w;save();render()}
async function revs(){let l=[];try{l=await api('/api/reviews')}catch(e){}
$('#rl').innerHTML=l.length?l.map(r=>`<div class="g"><div class="row sb"><h3>${esc(r.name)}</h3><span class="st">${'★'.repeat(r.stars)}</span></div><div class="m">${esc(r.text)}</div></div>`).join(''):'<div class="m">Отзывов пока нет. Станьте первым!</div>'}
function reviews(){setTimeout(revs);return`<h2>Отзывы</h2><div class="g"><div class="st" id="stars">${[1,2,3,4,5].map(i=>`<span onclick="rv.stars=${i};stars()">${i<=rv.stars?'★':'☆'}</span>`).join('')}</div><textarea id="rt" rows="3" placeholder="Что понравилось?"></textarea><button class="btn" onclick="sendRev()">Отправить отзыв</button></div><div id="rl"></div>`}
const stars=()=>$('#stars').innerHTML=[1,2,3,4,5].map(i=>`<span onclick="rv.stars=${i};stars()">${i<=rv.stars?'★':'☆'}</span>`).join('');
async function sendRev(){const t=$('#rt').value.trim();if(t.length<3)return tg.showAlert('Напишите пару слов');try{await api('/api/reviews',{stars:rv.stars,text:t});$('#rt').value='';revs()}catch(e){tg.showAlert('Не удалось отправить')}}
function sett(){const s=S.set;return`<h2>Настройки</h2><div class="g"><h3>Тема</h3><div class="seg">${[['auto','Авто'],['light','Светлая'],['dark','Тёмная']].map(([k,t])=>`<button class="${s.theme==k?'on':''}" onclick="S.set.theme='${k}';save();skin();render()">${t}</button>`).join('')}</div>
<h3 style="margin-top:16px">Цвет акцента</h3><div class="row">${[['coral','#f0645a'],['teal','#2f9a8c'],['violet','#9a6bf0']].map(([k,c])=>`<button class="dot ${s.acc==k?'on':''}" style="background:${c}" onclick="S.set.acc='${k}';save();skin();render()"></button>`).join('')}</div></div>
<div class="g"><div class="row sb"><div><h3>Уведомления</h3><div class="m">Бот спросит, как прошёл день</div></div><button class="sw ${s.notify?'on':''}" onclick="togN()"></button></div>${s.notify?`<div class="row sb" style="margin-top:12px"><span>Время</span><input type="time" value="${s.time}" style="width:130px;margin:0" onchange="S.set.time=this.value;save();syncN()"></div>`:''}</div>
<div class="g row sb"><div><h3>Вибрация</h3><div class="m">Тактильный отклик</div></div><button class="sw ${s.hap?'on':''}" onclick="S.set.hap=!S.set.hap;save();render()"></button></div>
<button class="btn s" onclick="tg.showConfirm('Удалить все данные?',ok=>{if(ok){localStorage.removeItem('cb');location.reload()}})">Сбросить данные</button>`}
function togN(){S.set.notify=!S.set.notify;save();if(S.set.notify&&tg.requestWriteAccess)tg.requestWriteAccess();syncN();render()}
const syncN=()=>api('/api/settings',{notify:S.set.notify,time:S.set.time,tz:new Date().getTimezoneOffset(),name:S.p?.name}).catch(()=>{});
const TABS=[['home','☀️','Сегодня',home],['work','🏋️','Тренировки',work],['food','🥗','Питание',food],['rec','👨‍🍳','Рецепты',recipes],['prof','👤','Профиль',prof],['rev','⭐','Отзывы',reviews],['set','⚙️','Настройки',sett]];
function render(){skin();if(!S.p)return onb();const n=$('#nav');n.style.display='flex';n.innerHTML=TABS.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';render();scrollTo(0,0)"><span>${t[1]}</span>${t[2]}</button>`).join('');$('#v').innerHTML=TABS.find(t=>t[0]==tab)[3]();n.querySelector('.on')?.scrollIntoView({inline:'center',block:'nearest'})}
render();if(S.p)syncN();
</script></body></html>
